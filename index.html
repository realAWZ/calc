<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Calculator">
  <title>Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      background: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      position: fixed;
      inset: 0;
    }

    .calc-container {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      height: 100%;
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      padding: 0 16px max(env(safe-area-inset-bottom, 20px), 16px);
    }

    /* Top Native Controls (iOS 18) */
    .top-bar {
      position: absolute;
      top: max(env(safe-area-inset-top, 48px), 44px);
      left: 0;
      right: 0;
      max-width: 430px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 30;
    }
    .icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .icon-btn svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.9;
    }
    .icon-btn:active {
      background: rgba(255, 255, 255, 0.25);
    }

    /* Display Area - Right-aligns flush with the 4th column */
    .display-area {
      padding: 0 0 6px 0;
      text-align: right;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      width: 100%;
    }
    #expression {
      color: #8e8e93;
      font-size: 2.1rem;
      font-weight: 400;
      min-height: 2.5rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.4px;
      margin-bottom: 2px;
    }
    #display {
      font-size: 5.4rem;
      font-weight: 300;
      letter-spacing: -1px;
      white-space: nowrap;
      line-height: 1.02;
    }

    /* Keypad Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      width: 100%;
    }
    button {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      border: none;
      font-size: 2.3rem;
      font-weight: 400;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
      transition: background-color 0.1s, filter 0.05s ease;
    }
    button:active {
      filter: brightness(1.35);
    }

    .btn-num { background: #2f2f31; color: #ffffff; }
    .btn-func { background: #505052; color: #ffffff; font-size: 1.85rem; }
    .btn-op { background: #ff9f0a; color: #ffffff; font-size: 2.7rem; padding-bottom: 3px; }
    .btn-op.active { background: #ffffff !important; color: #ff9f0a !important; }

    .backspace-icon {
      width: 27px;
      height: 27px;
      stroke: #ffffff;
      stroke-width: 1.8;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <!-- Clock icon (Secret Peek Trigger) -->
    <div class="icon-btn" onclick="peekCounter()">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9"/>
        <polyline points="12 7 12 12 15 14"/>
      </svg>
    </div>
    <!-- Exact Native iOS 18 Calculator SF Symbol -->
    <div class="icon-btn">
      <svg viewBox="0 0 24 24">
        <rect x="5" y="3" width="14" height="18" rx="3"/>
        <rect x="7.5" y="5.5" width="9" height="3" rx="0.5" fill="#ffffff" stroke="none" opacity="0.9"/>
        <circle cx="8.5" cy="11.5" r="0.8" fill="#ffffff"/>
        <circle cx="12" cy="11.5" r="0.8" fill="#ffffff"/>
        <circle cx="15.5" cy="11.5" r="0.8" fill="#ffffff"/>
        <circle cx="8.5" cy="15" r="0.8" fill="#ffffff"/>
        <circle cx="12" cy="15" r="0.8" fill="#ffffff"/>
        <circle cx="15.5" cy="15" r="0.8" fill="#ffffff"/>
        <circle cx="8.5" cy="18.5" r="0.8" fill="#ffffff"/>
        <circle cx="12" cy="18.5" r="0.8" fill="#ffffff"/>
        <circle cx="15.5" cy="18.5" r="0.8" fill="#ffffff"/>
      </svg>
    </div>
  </div>

  <div class="calc-container">
    <div class="display-area">
      <div id="expression"></div>
      <div id="display">0</div>
    </div>

    <div class="grid">
      <button class="btn-func" onclick="pressBackspace()">
        <svg class="backspace-icon" viewBox="0 0 24 24">
          <path d="M21 4H8l-6 8 6 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/>
          <line x1="18" y1="9" x2="12" y2="15"/>
          <line x1="12" y1="9" x2="18" y2="15"/>
        </svg>
      </button>
      <button class="btn-func" id="btn-clear" onclick="pressClear()">AC</button>
      <button class="btn-func" onclick="pressPercent()">%</button>
      <button class="btn-op" id="op-div" onclick="setOp('÷')">÷</button>

      <button class="btn-num" onclick="pressKey('7')">7</button>
      <button class="btn-num" onclick="pressKey('8')">8</button>
      <button class="btn-num" onclick="pressKey('9')">9</button>
      <button class="btn-op" id="op-mul" onclick="setOp('×')">×</button>

      <button class="btn-num" onclick="pressKey('4')">4</button>
      <button class="btn-num" onclick="pressKey('5')">5</button>
      <button class="btn-num" onclick="pressKey('6')">6</button>
      <button class="btn-op" id="op-sub" onclick="setOp('−')">−</button>

      <button class="btn-num" onclick="pressKey('1')">1</button>
      <button class="btn-num" onclick="pressKey('2')">2</button>
      <button class="btn-num" onclick="pressKey('3')">3</button>
      <button class="btn-op" id="op-add" onclick="setOp('+')">+</button>

      <button class="btn-num" onclick="pressPlusMinus()">+/-</button>
      <button class="btn-num" onclick="pressKey('0')">0</button>
      <button class="btn-num" onclick="pressDecimal()">.</button>
      <button class="btn-op" onclick="evaluateResult()">=</button>
    </div>
  </div>

  <script>
    let runningVal = null;
    let currentInput = "0";
    let pendingOp = null;
    let fullExpression = "";
    let isWaitingForNextNumber = false;

    // Force engine state
    let isForcing = false;
    let forceDigits = [];
    let forceIndex = 0;
    let forcedAccumulator = "";

    // Target formula matching your original photo: M D YY H MM
    // e.g. Oct 4, 2026, 11:22 PM -> 10 4 26 11 22 -> 10,426,1122
    function getTargetTimestamp() {
      const now = new Date();
      const m = String(now.getMonth() + 1);
      const d = String(now.getDate());
      const y = String(now.getFullYear()).slice(-2);
      
      let hr = now.getHours() % 12;
      if (hr === 0) hr = 12;
      const min = String(now.getMinutes()).padStart(2, '0');

      return parseInt(`${m}${d}${y}${hr}${min}`, 10);
    }

    function formatNumber(str) {
      if (!str || str === "-") return str;
      const parts = str.toString().split(".");
      parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      return parts.join(".");
    }

    function fitFont() {
      const d = document.getElementById("display");
      const len = d.innerText.length;
      if (len > 11) d.style.fontSize = "2.6rem";
      else if (len > 8) d.style.fontSize = "3.4rem";
      else if (len > 6) d.style.fontSize = "4.2rem";
      else d.style.fontSize = "5.4rem";
    }

    function clearActiveOps() {
      document.querySelectorAll('.btn-op').forEach(btn => btn.classList.remove('active'));
    }

    // Top-left History button triggers peek
    function peekCounter() {
      const expr = document.getElementById("expression");
      const original = expr.innerText;
      
      // Calculate delta if '+' hasn't been tapped yet
      if (!isForcing) {
        const current = parseFloat(currentInput.replace(/,/g, '')) || (runningVal || 0);
        const target = getTargetTimestamp();
        let delta = target - current;
        if (delta <= 0) delta = Math.abs(delta) + 1000000;
        const count = delta.toString().length;
        expr.innerText = `[ Tap ${count} digits ]`;
      } else {
        const remaining = Math.max(0, forceDigits.length - forceIndex);
        expr.innerText = `[ Tap ${remaining} digits ]`;
      }

      setTimeout(() => {
        expr.innerText = original;
      }, 1500);
    }

    function pressKey(digit) {
      const disp = document.getElementById("display");
      const expr = document.getElementById("expression");
      document.getElementById("btn-clear").innerText = "C";

      if (isForcing) {
        clearActiveOps();
        if (forceIndex < forceDigits.length) {
          forcedAccumulator += forceDigits[forceIndex];
          forceIndex++;
          disp.innerText = formatNumber(forcedAccumulator);
          expr.innerText = fullExpression + formatNumber(forcedAccumulator);
          fitFont();
        }
        // If volunteer taps more times than required, swallow extra taps cleanly
        return;
      }

      if (isWaitingForNextNumber) {
        currentInput = digit;
        isWaitingForNextNumber = false;
        clearActiveOps();
      } else {
        currentInput = (currentInput === "0") ? digit : currentInput + digit;
      }

      disp.innerText = formatNumber(currentInput);
      expr.innerText = fullExpression + formatNumber(currentInput);
      fitFont();
    }

    function pressDecimal() {
      if (isForcing) return;
      if (isWaitingForNextNumber) {
        currentInput = "0.";
        isWaitingForNextNumber = false;
        clearActiveOps();
      } else if (!currentInput.includes(".")) {
        currentInput += ".";
      }
      document.getElementById("display").innerText = formatNumber(currentInput);
      document.getElementById("expression").innerText = fullExpression + formatNumber(currentInput);
    }

    function compute(a, b, op) {
      if (op === '×') return a * b;
      if (op === '÷') return a / b;
      if (op === '+') return a + b;
      if (op === '−') return a - b;
      return b;
    }

    function setOp(op) {
      const current = parseFloat(currentInput.replace(/,/g, ''));
      clearActiveOps();

      const opMap = { '÷': 'op-div', '×': 'op-mul', '−': 'op-sub', '+': 'op-add' };
      const btn = document.getElementById(opMap[op]);
      if (btn) btn.classList.add('active');

      if (runningVal === null) {
        runningVal = current;
      } else if (!isWaitingForNextNumber && pendingOp) {
        runningVal = compute(runningVal, current, pendingOp);
        document.getElementById("display").innerText = formatNumber(String(runningVal));
        fitFont();
      }

      pendingOp = op;
      fullExpression = `${formatNumber(String(runningVal))}${op}`;
      document.getElementById("expression").innerText = fullExpression;
      isWaitingForNextNumber = true;

      // Arm force mode when '+' is tapped
      if (op === '+') {
        const target = getTargetTimestamp();
        let delta = target - runningVal;
        if (delta <= 0) delta = Math.abs(delta) + 1000000;

        forceDigits = delta.toString().split('');
        forceIndex = 0;
        forcedAccumulator = "";
        isForcing = true;
      }
    }

    function evaluateResult() {
      clearActiveOps();
      const disp = document.getElementById("display");
      const expr = document.getElementById("expression");

      let added = isForcing ? parseFloat(forcedAccumulator) : parseFloat(currentInput.replace(/,/g, ''));
      if (isNaN(added)) added = 0;

      let total = runningVal !== null ? compute(runningVal, added, pendingOp || '+') : added;

      expr.innerText = fullExpression + formatNumber(String(added));
      disp.innerText = formatNumber(String(total));
      fitFont();

      runningVal = total;
      currentInput = String(total);
      pendingOp = null;
      isWaitingForNextNumber = true;
      isForcing = false;
      document.getElementById("btn-clear").innerText = "AC";
    }

    function pressClear() {
      const btn = document.getElementById("btn-clear");
      if (btn.innerText === "C") {
        currentInput = "0";
        document.getElementById("display").innerText = "0";
        document.getElementById("expression").innerText = fullExpression;
        btn.innerText = "AC";
      } else {
        runningVal = null;
        currentInput = "0";
        pendingOp = null;
        fullExpression = "";
        isWaitingForNextNumber = false;
        isForcing = false;
        forceDigits = [];
        forceIndex = 0;
        forcedAccumulator = "";
        clearActiveOps();
        document.getElementById("expression").innerText = "";
        document.getElementById("display").innerText = "0";
      }
      fitFont();
    }

    function pressBackspace() {
      if (isForcing || isWaitingForNextNumber) return;
      if (currentInput.length > 1) {
        currentInput = currentInput.slice(0, -1);
      } else {
        currentInput = "0";
        document.getElementById("btn-clear").innerText = "AC";
      }
      document.getElementById("display").innerText = formatNumber(currentInput);
      document.getElementById("expression").innerText = fullExpression + (currentInput === "0" ? "" : formatNumber(currentInput));
      fitFont();
    }

    function pressPlusMinus() {
      if (isForcing) return;
      currentInput = currentInput.startsWith("-") ? currentInput.slice(1) : "-" + currentInput;
      document.getElementById("display").innerText = formatNumber(currentInput);
    }

    function pressPercent() {
      if (isForcing) return;
      const num = parseFloat(currentInput.replace(/,/g, '')) / 100;
      currentInput = String(num);
      document.getElementById("display").innerText = formatNumber(currentInput);
    }
  </script>
</body>
</html>
