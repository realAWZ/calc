<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Calculator">
  <title>Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      background: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      position: fixed;
      inset: 0;
    }

    /* Fixed full-width container matching native iOS margin specs */
    .calc-screen {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      height: 100%;
      width: 100%;
      max-width: 414px;
      margin: 0 auto;
      padding-left: 16px;
      padding-right: 16px;
      padding-bottom: max(env(safe-area-inset-bottom, 20px), 16px);
    }

    /* Top Native Controls (iOS 18) */
    .top-bar {
      position: absolute;
      top: max(env(safe-area-inset-top, 48px), 44px);
      left: 0;
      right: 0;
      max-width: 414px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 40;
    }
    .icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .icon-btn svg {
      width: 21px;
      height: 21px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.9;
    }
    .icon-btn:active {
      background: rgba(255, 255, 255, 0.25);
    }

    /* Display Area - Zero horizontal padding so it hits the exact grid boundaries */
    .display-area {
      padding: 0;
      margin: 0 0 6px 0;
      text-align: right;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      width: 100%;
    }
    #expression {
      color: #8e8e93;
      font-size: 2.1rem;
      font-weight: 400;
      min-height: 2.4rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.4px;
      margin-bottom: 2px;
    }
    #display {
      font-size: 5.4rem;
      font-weight: 300;
      letter-spacing: -1px;
      white-space: nowrap;
      line-height: 1.04;
      color: #ffffff;
    }

    /* Keypad Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      width: 100%;
      margin: 0;
      padding: 0;
    }
    button {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      border: none;
      font-size: 2.3rem;
      font-weight: 400;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
      transition: background-color 0.1s, filter 0.05s ease;
    }
    button:active {
      filter: brightness(1.35);
    }

    .btn-num { background: #2f2f31; color: #ffffff; }
    .btn-func { background: #505052; color: #ffffff; font-size: 1.85rem; }
    .btn-op { background: #ff9f0a; color: #ffffff; font-size: 2.7rem; padding-bottom: 3px; }
    .btn-op.active { background: #ffffff !important; color: #ff9f0a !important; }

    .backspace-icon {
      width: 27px;
      height: 27px;
      stroke: #ffffff;
      stroke-width: 1.8;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body onclick="handleGlobalClick(event)">

  <div class="top-bar">
    <!-- Clock (Secret Peek Trigger) -->
    <div class="icon-btn" onclick="peekCounter(event)">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9"/>
        <polyline points="12 7 12 12 15 14"/>
      </svg>
    </div>
    <!-- 1:1 Apple SF Symbol Calculator Icon -->
    <div class="icon-btn">
      <svg viewBox="0 0 24 24">
        <rect x="5.5" y="3.5" width="13" height="17" rx="2.5" stroke="#ffffff" stroke-width="1.8"/>
        <rect x="7.5" y="5.5" width="9" height="2.8" rx="0.5" fill="#ffffff" stroke="none" opacity="0.9"/>
        <rect x="7.5" y="10.5" width="3.8" height="2.2" rx="0.5" fill="#ffffff" stroke="none" opacity="0.9"/>
        <rect x="12.7" y="10.5" width="3.8" height="2.2" rx="0.5" fill="#ffffff" stroke="none" opacity="0.9"/>
        <rect x="7.5" y="13.7" width="3.8" height="2.2" rx="0.5" fill="#ffffff" stroke="none" opacity="0.9"/>
        <rect x="12.7" y="13.7" width="3.8" height="2.2" rx="0.5" fill="#ffffff" stroke="none" opacity="0.9"/>
        <rect x="7.5" y="16.9" width="3.8" height="2.2" rx="0.5" fill="#ffffff" stroke="none" opacity="0.9"/>
        <rect x="12.7" y="16.9" width="3.8" height="2.2" rx="0.5" fill="#ffffff" stroke="none" opacity="0.9"/>
      </svg>
    </div>
  </div>

  <div class="calc-screen">
    <div class="display-area">
      <div id="expression"></div>
      <div id="display">0</div>
    </div>

    <div class="grid">
      <button class="btn-func" onclick="pressBackspace(event)">
        <svg class="backspace-icon" viewBox="0 0 24 24">
          <path d="M21 4H8l-6 8 6 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/>
          <line x1="18" y1="9" x2="12" y2="15"/>
          <line x1="12" y1="9" x2="18" y2="15"/>
        </svg>
      </button>
      <button class="btn-func" id="btn-clear" onclick="pressClear(event)">AC</button>
      <button class="btn-func" onclick="pressPercent(event)">%</button>
      <button class="btn-op" id="op-div" onclick="setOp('÷', event)">÷</button>

      <button class="btn-num" onclick="pressKey('7', event)">7</button>
      <button class="btn-num" onclick="pressKey('8', event)">8</button>
      <button class="btn-num" onclick="pressKey('9', event)">9</button>
      <button class="btn-op" id="op-mul" onclick="setOp('×', event)">×</button>

      <button class="btn-num" onclick="pressKey('4', event)">4</button>
      <button class="btn-num" onclick="pressKey('5', event)">5</button>
      <button class="btn-num" onclick="pressKey('6', event)">6</button>
      <button class="btn-op" id="op-sub" onclick="setOp('−', event)">−</button>

      <button class="btn-num" onclick="pressKey('1', event)">1</button>
      <button class="btn-num" onclick="pressKey('2', event)">2</button>
      <button class="btn-num" onclick="pressKey('3', event)">3</button>
      <button class="btn-op" id="op-add" onclick="setOp('+', event)">+</button>

      <button class="btn-num" onclick="pressPlusMinus(event)">+/-</button>
      <button class="btn-num" onclick="pressKey('0', event)">0</button>
      <button class="btn-num" onclick="pressDecimal(event)">.</button>
      <button class="btn-op" id="op-equal" onclick="evaluateResult(event)">=</button>
    </div>
  </div>

  <script>
    let runningVal = null;
    let currentInput = "0";
    let pendingOp = null;
    let fullExpression = "";
    let isWaitingForNextNumber = false;
    let inEquationView = false;

    // Force engine state
    let isForcing = false;
    let forceDigits = [];
    let forceIndex = 0;
    let forcedAccumulator = "";

    // Target formula projected +90 seconds (1.5 minutes) ahead
    function getTargetTimestamp() {
      const targetDate = new Date(Date.now() + 90 * 1000);

      const m = String(targetDate.getMonth() + 1);
      const d = String(targetDate.getDate()).padStart(2, '0');
      const y = String(targetDate.getFullYear()).slice(-2);
      
      let hr = targetDate.getHours() % 12;
      if (hr === 0) hr = 12;
      const min = String(targetDate.getMinutes()).padStart(2, '0');

      return parseInt(`${m}${d}${y}${hr}${min}`, 10);
    }

    function formatNumber(str) {
      if (!str || str === "-") return str;
      const parts = str.toString().split(".");
      parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      return parts.join(".");
    }

    function fitFont() {
      const d = document.getElementById("display");
      const len = d.innerText.length;
      if (len > 12) d.style.fontSize = "2.4rem";
      else if (len > 9) d.style.fontSize = "3.2rem";
      else if (len > 6) d.style.fontSize = "4.2rem";
      else d.style.fontSize = "5.4rem";
    }

    function clearActiveOps() {
      document.querySelectorAll('.btn-op').forEach(btn => btn.classList.remove('active'));
    }

    function peekCounter(e) {
      if (e) e.stopPropagation();
      const expr = document.getElementById("expression");
      const original = expr.innerText;
      
      if (!isForcing) {
        const current = parseFloat(currentInput.replace(/,/g, '')) || (runningVal || 0);
        const target = getTargetTimestamp();
        let delta = target - current;
        if (delta <= 0) delta = Math.abs(delta) + 1000000;
        const count = delta.toString().length;
        expr.innerText = `[ Tap ${count} digits ]`;
      } else {
        const remaining = Math.max(0, forceDigits.length - forceIndex);
        expr.innerText = `[ Tap ${remaining} digits ]`;
      }

      setTimeout(() => {
        expr.innerText = original;
      }, 1500);
    }

    function handleGlobalClick(e) {
      if (isForcing && !e.target.closest('#op-equal') && !e.target.closest('.icon-btn')) {
        injectNextForcedDigit();
      }
    }

    function injectNextForcedDigit() {
      const disp = document.getElementById("display");
      const expr = document.getElementById("expression");
      clearActiveOps();

      if (forceIndex < forceDigits.length) {
        forcedAccumulator += forceDigits[forceIndex];
        forceIndex++;

        disp.innerText = fullExpression + formatNumber(forcedAccumulator);
        expr.innerText = "";
        fitFont();
      }
    }

    function pressKey(digit, e) {
      if (e) e.stopPropagation();
      const disp = document.getElementById("display");
      const expr = document.getElementById("expression");
      document.getElementById("btn-clear").innerText = "C";

      if (isForcing) {
        injectNextForcedDigit();
        return;
      }

      if (isWaitingForNextNumber) {
        currentInput = digit;
        isWaitingForNextNumber = false;
        clearActiveOps();
      } else {
        currentInput = (currentInput === "0") ? digit : currentInput + digit;
      }

      if (inEquationView) {
        disp.innerText = fullExpression + formatNumber(currentInput);
        expr.innerText = "";
      } else {
        disp.innerText = formatNumber(currentInput);
        expr.innerText = "";
      }
      fitFont();
    }

    function pressDecimal(e) {
      if (e) e.stopPropagation();
      if (isForcing) {
        injectNextForcedDigit();
        return;
      }
      if (isWaitingForNextNumber) {
        currentInput = "0.";
        isWaitingForNextNumber = false;
        clearActiveOps();
      } else if (!currentInput.includes(".")) {
        currentInput += ".";
      }
      document.getElementById("display").innerText = inEquationView ? (fullExpression + formatNumber(currentInput)) : formatNumber(currentInput);
    }

    function compute(a, b, op) {
      if (op === '×') return a * b;
      if (op === '÷') return a / b;
      if (op === '+') return a + b;
      if (op === '−') return a - b;
      return b;
    }

    function setOp(op, e) {
      if (e) e.stopPropagation();
      const current = parseFloat(currentInput.replace(/,/g, ''));
      clearActiveOps();

      const opMap = { '÷': 'op-div', '×': 'op-mul', '−': 'op-sub', '+': 'op-add' };
      const btn = document.getElementById(opMap[op]);
      if (btn) btn.classList.add('active');

      if (runningVal === null) {
        runningVal = current;
      } else if (!isWaitingForNextNumber && pendingOp) {
        runningVal = compute(runningVal, current, pendingOp);
      }

      pendingOp = op;
      fullExpression = `${formatNumber(String(runningVal))}${op}`;
      
      inEquationView = true;
      document.getElementById("display").innerText = fullExpression;
      document.getElementById("expression").innerText = "";
      fitFont();

      isWaitingForNextNumber = true;

      if (op === '+') {
        const target = getTargetTimestamp();
        let delta = target - runningVal;
        if (delta <= 0) delta = Math.abs(delta) + 1000000;

        forceDigits = delta.toString().split('');
        forceIndex = 0;
        forcedAccumulator = "";
        isForcing = true;
      }
    }

    function evaluateResult(e) {
      if (e) e.stopPropagation();
      clearActiveOps();
      const disp = document.getElementById("display");
      const expr = document.getElementById("expression");

      let added = isForcing ? parseFloat(forcedAccumulator) : parseFloat(currentInput.replace(/,/g, ''));
      if (isNaN(added)) added = 0;

      let total = runningVal !== null ? compute(runningVal, added, pendingOp || '+') : added;

      expr.innerText = fullExpression + formatNumber(String(added));
      disp.innerText = formatNumber(String(total));
      fitFont();

      runningVal = total;
      currentInput = String(total);
      pendingOp = null;
      isWaitingForNextNumber = true;
      inEquationView = false;
      isForcing = false;
      document.getElementById("btn-clear").innerText = "AC";
    }

    function pressClear(e) {
      if (e) e.stopPropagation();
      const btn = document.getElementById("btn-clear");
      if (btn.innerText === "C") {
        currentInput = "0";
        document.getElementById("display").innerText = fullExpression || "0";
        btn.innerText = "AC";
      } else {
        runningVal = null;
        currentInput = "0";
        pendingOp = null;
        fullExpression = "";
        isWaitingForNextNumber = false;
        inEquationView = false;
        isForcing = false;
        forceDigits = [];
        forceIndex = 0;
        forcedAccumulator = "";
        clearActiveOps();
        document.getElementById("expression").innerText = "";
        document.getElementById("display").innerText = "0";
      }
      fitFont();
    }

    function pressBackspace(e) {
      if (e) e.stopPropagation();
      if (isForcing || isWaitingForNextNumber) return;
      if (currentInput.length > 1) {
        currentInput = currentInput.slice(0, -1);
      } else {
        currentInput = "0";
        document.getElementById("btn-clear").innerText = "AC";
      }
      document.getElementById("display").innerText = inEquationView ? (fullExpression + formatNumber(currentInput)) : formatNumber(currentInput);
      fitFont();
    }

    function pressPlusMinus(e) {
      if (e) e.stopPropagation();
      if (isForcing) return;
      currentInput = currentInput.startsWith("-") ? currentInput.slice(1) : "-" + currentInput;
      document.getElementById("display").innerText = formatNumber(currentInput);
    }

    function pressPercent(e) {
      if (e) e.stopPropagation();
      if (isForcing) return;
      const num = parseFloat(currentInput.replace(/,/g, '')) / 100;
      currentInput = String(num);
      document.getElementById("display").innerText = formatNumber(currentInput);
    }
  </script>
</body>
</html>
